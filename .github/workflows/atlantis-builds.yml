name: Atlantis builds
# Test builds of the atlantis-v2 branch for the fork's owner: a macOS app
# (Apple Silicon) with the Cryo Omni3D engines, downloadable from the run's
# artifacts.  The app is signed ad hoc only (not notarised).  It is built on
# macOS 15 with a 15.0 deployment target, so it runs on Sequoia and later
# (Homebrew's libraries target the runner's macOS version).
on:
  push:
    branches: [atlantis-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: brew install freetype libpng jpeg-turbo dylibbundler
      # Homebrew's sdl2 is sdl2-compat, which dlopen()s SDL3 at run time:
      # dylibbundler cannot see SDL3, and the app fails to start on a Mac
      # without Homebrew.  Build the real SDL2 instead.
      - name: Build SDL2
        run: |
          git clone --depth 1 --branch SDL2 https://github.com/libsdl-org/SDL.git sdl2-src
          cmake -S sdl2-src -B sdl2-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl2" -DSDL_TEST=OFF
          cmake --build sdl2-build -j$(sysctl -n hw.ncpu)
          cmake --install sdl2-build
          echo "$HOME/sdl2/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: ./configure --disable-all-engines --enable-engine=cryomni3d,versailles,atlantis --enable-release
      - name: Build
        run: make -j$(sysctl -n hw.ncpu)
      - name: Make the app
        run: |
          cp scummvm scummvm-static
          make scummvm.docktileplugin
          make bundle-pack
          dylibbundler -od -b -x ScummVM.app/Contents/MacOS/scummvm \
            -d ScummVM.app/Contents/libs/ -p @executable_path/../libs/
          codesign --force --deep --sign - ScummVM.app
      - name: Check the bundled libraries
        run: |
          # Nothing may point outside the app or the system, nor load SDL3.
          if otool -L ScummVM.app/Contents/MacOS/scummvm ScummVM.app/Contents/libs/*.dylib \
              | grep -E '/opt/homebrew|/usr/local|sdl2-compat|SDL3'; then exit 1; fi
          if strings ScummVM.app/Contents/libs/*.dylib | grep -q 'libSDL3'; then exit 1; fi
          otool -L ScummVM.app/Contents/MacOS/scummvm
      - name: Check the minimum macOS of every binary
        run: |
          bad=0
          for f in ScummVM.app/Contents/MacOS/scummvm ScummVM.app/Contents/libs/*.dylib; do
            v=$(vtool -show-build "$f" | awk '/minos/ {print $2; exit}')
            echo "$v $f"
            case "$v" in 15.*|1[0-4].*|[0-9].*) ;; *) bad=1 ;; esac
          done
          exit $bad
      - name: Zip the app
        run: |
          ditto -c -k --keepParent ScummVM.app ScummVM-atlantis-macos-arm64.zip
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: ScummVM-atlantis-macos-arm64
          path: ScummVM-atlantis-macos-arm64.zip
          retention-days: 30
